; Field Compass - PlatformIO configuration
; =============================================================================
; Epic #154 task B1 (#183). Platform, board and memory only.
; lib_deps is B3 (#185); source layout is B4 (#186); TFT_eSPI build_flags are
; B2 (#184). Do not add those here - they are serialized on purpose because
; every one of them edits this file.
;
; Every value below is traced to arduino-cli's own configuration for the
; working build, not chosen by preference. Where this file deliberately
; overrides a PlatformIO default, the reason is stated inline.
; =============================================================================

[platformio]
; TEMPORARY BRIDGE - removed by B4 (#186).
; PlatformIO looks in src/ by default; the sketch still lives in Field_Compass/.
; Pointing at it here lets B1 be verified against a real compile instead of
; only proving the config parses. B4 moves the source and deletes this section.
;
; NOTE: src_dir is a [platformio] option. Putting it under [env:] is silently
; ignored with only a warning on line 1 of the build log, and the symptom is a
; link failure with "undefined reference to setup()" - the framework builds,
; the sketch never does.
src_dir = Field_Compass

[env:feather_s3]
; pioarduino, NOT platformio/espressif32. Espressif stopped maintaining
; PlatformIO support and the official platform tops out at Arduino core 2.x.
;
; PINNED TO 55.03.38-1 = "Arduino Release v3.3.8 based on ESP-IDF v5.5.4".
; That is the SAME core arduino-cli builds with (docs/library-manifest.md), so
; B6's parity check compares two toolchains rather than two toolchains AND two
; cores.
;
; The design plan originally specified 53.03.13-1, copied from the meshcore and
; Crosswire projects. That release ships core 3.1.3 — verified by building with
; it: "framework-arduinoespressif32 @ 3.1.3". Different release line entirely.
; Core drift is exactly what broke this project (#164: untouched source went
; from building to not linking when the core moved), so the core version is
; pinned deliberately, not inherited.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board     = adafruit_feather_esp32s3
framework = arduino

monitor_speed = 115200

; --- PSRAM ------------------------------------------------------------------
; The single most expensive setting in this file. PlatformIO's board JSON does
; not specify memory_type at all, so it must be explicit here.
;
; qio_qspi = QIO flash + QUAD-SPI PSRAM. This board (Adafruit PID 5477) has 2MB
; QUAD PSRAM, not octal - boards.txt gives build.flash_type=qio and
; build.psram_type=qspi. Setting octal (qio_opi) would leave PSRAM absent with
; NO build error: the LVGL draw buffers AND the LVGL heap (#164) both live in
; PSRAM and would fail to allocate at runtime instead.
board_build.arduino.memory_type = qio_qspi

; --- Partition table --------------------------------------------------------
; VENDORED, not referenced by name. PlatformIO's board JSON defaults to
; tinyuf2-partitions-4MB.csv - the WITH-OTA variant, ~1.3MB app. The firmware
; is 1,815,046 bytes and does NOT fit that. arduino-cli uses the -noota variant
; (2816K app), which is where the familiar "Maximum is 2883584" comes from.
;
; The vendored copy is byte-identical to the table the working arduino-cli
; build generates. Keeping it in-repo rather than trusting a filename to
; resolve is the same lesson as Epic A: build inputs live in git.
board_build.partitions = partitions/tinyuf2-partitions-4MB-noota.csv

; --- Flash ------------------------------------------------------------------
; boards.txt: build.flash_size=4MB, build.flash_freq=80m, build.flash_mode=dio.
; PlatformIO's board JSON says flash_mode=qio. dio is chosen here to match the
; arduino-cli build so B6's parity check compares like with like; qio may be a
; deliberate improvement later, but not as an accident of tooling.
board_upload.flash_size = 4MB
board_build.flash_mode  = dio
board_build.f_flash     = 80000000L
board_build.f_cpu       = 240000000L

; =============================================================================
; BUILD ENVIRONMENT - two traps that cost a build each (#183)
; =============================================================================
; 1. RUN pio FROM POWERSHELL OR CMD, NOT GIT BASH.
;    This platform runs idf_tools.py at install time and it hard-refuses MSys/
;    MinGW: "ERROR: MSys/Mingw is not supported". Under Git Bash the tool
;    packages fail to install, then the build dies with either
;    "'xtensa-esp32s3-elf-g++' is not recognized" or a pathlib TypeError on
;    FRAMEWORK_DIR being None. Neither names the real cause.
;
; 2. IF FRAMEWORK_DIR IS None, THE PACKAGE CACHE HAS A VERSION CONFLICT.
;    A globally cached framework-arduinoespressif32 from a DIFFERENT spec URI
;    (seen here: 3.3.9, wanted 3.3.8) leaves the requirement unsatisfied, and
;    PlatformIO reports it as a pathlib TypeError rather than a resolution
;    error. Fix with a project-scoped resolve:
;        pio pkg install
;    run from the project directory, which fetches the exact pinned packages.
;
; =============================================================================
; KNOWN GAP - carried into B6 (#188), not solved here
; =============================================================================
; arduino-cli does two things for this board that PlatformIO does not:
;
;   1. custom_bootloader = bootloader-tinyuf2  (not the stock bootloader)
;   2. writes variants/adafruit_feather_esp32s3/tinyuf2.bin at 0x2d0000
;
; The vendored partition table reserves the 256K "uf2" factory partition, so a
; PlatformIO flash will not clobber an already-installed TinyUF2. But PIO will
; install the STOCK bootloader, which may break UF2 drag-and-drop and the
; double-tap-reset behaviour.
;
; That must be verified on hardware before arduino-cli is retired (#161), and
; the bootloader question resolved in B6. Do not assume it is harmless.
