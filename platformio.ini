; Field Compass - PlatformIO configuration
; =============================================================================
; Epic #154 task B1 (#183). Platform, board and memory only.
; lib_deps is B3 (#185); source layout is B4 (#186); TFT_eSPI build_flags are
; B2 (#184). Do not add those here - they are serialized on purpose because
; every one of them edits this file.
;
; Every value below is traced to arduino-cli's own configuration for the
; working build, not chosen by preference. Where this file deliberately
; overrides a PlatformIO default, the reason is stated inline.
; =============================================================================

; LAYOUT (B4, #186). No [platformio] section: the source now lives where
; PlatformIO looks for it by default.
;
;   src/      src.ino + lv_psram_alloc.c  (was Field_Compass/Field_Compass.ino)
;   include/  lv_conf.h  (#158) — reached via -I include, see build_flags
;   lib/      vendored libraries; empty for now, everything is in lib_deps
;
; The B1 `src_dir = Field_Compass` bridge is deleted along with the directory
; it pointed at. Retained as a warning, because it cost a build to learn:
; src_dir is a [platformio] option, and putting it under [env:] is silently
; ignored with only a line-1 log warning. The symptom is a link failure with
; "undefined reference to setup()" — the framework builds, the sketch never
; does — which reads as a code problem rather than a config one.

; TWO BOARDS (#283). The bench moved from the Adafruit 5477 Feather to a UM
; FeatherS3[D] on 2026-09-05 (docs/HARDWARE.md, "UM FeatherS3 rewire"). One
; repo builds both: everything the boards share lives in the [env] base
; section below and is inherited by every [env:NAME]; each [env:NAME] carries
; only its board, memory, partition table, flash settings and the three
; TFT_eSPI control-line pins that differ per board. The other seven
; board-specific pins are selected in src/fc_config.h on the board macro the
; platform defines (ARDUINO_ADAFRUIT_FEATHER_ESP32S3 / ARDUINO_FEATHERS3).
; CI discovers [env:*] sections and skips the bare [env] (compile.yml).

[env]
; pioarduino, NOT platformio/espressif32. Espressif stopped maintaining
; PlatformIO support and the official platform tops out at Arduino core 2.x.
;
; PINNED TO 55.03.38-1 = "Arduino Release v3.3.8 based on ESP-IDF v5.5.4".
; That is the SAME core arduino-cli builds with (docs/library-manifest.md), so
; B6's parity check compares two toolchains rather than two toolchains AND two
; cores.
;
; The design plan originally specified 53.03.13-1, copied from the meshcore and
; Crosswire projects. That release ships core 3.1.3 — verified by building with
; it: "framework-arduinoespressif32 @ 3.1.3". Different release line entirely.
; Core drift is exactly what broke this project (#164: untouched source went
; from building to not linking when the core moved), so the core version is
; pinned deliberately, not inherited.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino

monitor_speed = 115200

board_build.f_cpu       = 240000000L

; --- Build flags -------------------------------------------------------------
; TFT_eSPI configuration lives HERE, not in the library folder (#184).
;
; It previously lived in three files inside the Arduino libraries directory,
; outside git: User_Setup_Select.h, User_Setups/Setup_Field_Compass_ESP32S3_
; ST7789.h (the active one - the name says ST7789, the panel is ST7796) and an
; edited User_Setup.h. A library reinstall wiped them, and no other machine
; could reproduce the build. Same class as the patched ST7796_Rotation.h that
; Epic A removed (#157).
;
; USER_SETUP_LOADED tells TFT_eSPI to skip its own header selection entirely
; and take everything from here.
;
; Values transcribed from the active setup header, NOT from the docs. Note
; SPI_FREQUENCY is 40 MHz, while three comments in src/src.ino (1054, 5170,
; 5313) still say TFT_eSPI runs at 80 MHz. The header is authoritative and
; docs/HARDWARE.md agrees with it at 40 MHz. Tracked as #242 — those comments
; carry the rationale for SD_SPI_FREQ (#116), so they are not a text fix.
;
; TFT_CS / TFT_DC / TFT_RST are NOT here. They differ per board and each
; [env:NAME] appends its own three after ${env.build_flags}.
build_flags =
  -D USER_SETUP_LOADED=1
  -D USER_SETUP_ID=999
  ; SPI port selection (#284). Without this, TFT_eSPI 2.5.43 on ESP32-S3 sets
  ; SPI_PORT to FSPI, which Arduino core 3.x defines as bus index 0; the IDF's
  ; REG_SPI_BASE(0) is 0, so every TFT register pointer is NULL+offset and the
  ; first SPI write panics (StoreProhibited at 0x10) inside tft.init(). Seen on
  ; the first hardware run of any PlatformIO image (2026-09-07). USE_FSPI_PORT
  ; makes SPI_PORT 2 = GPSPI2, the same controller the Arduino SPI object uses
  ; for SD and FRAM, which is what upstream TFT_eSPI now defaults to on the S3.
  ; NOT USE_HSPI_PORT: that would put the TFT on GPSPI3 and the SD card's later
  ; SPI.begin would take GPIO 36/35/37 away from it in the pin matrix.
  -D USE_FSPI_PORT=1
  -D ST7796_DRIVER=1
  -D TFT_WIDTH=320
  -D TFT_HEIGHT=480
  -D TFT_INVERSION_ON=1
  ; SPI bus - identical on the Adafruit and UM Feather boards
  -D TFT_MOSI=35
  -D TFT_MISO=37
  -D TFT_SCLK=36
  ; Fonts
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT6=1
  -D LOAD_FONT7=1
  -D LOAD_FONT8=1
  -D LOAD_GFXFF=1
  -D SMOOTH_FONT=1
  ; Clocks
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  ; LVGL takes its config from include/lv_conf.h in this repo (#158), which
  ; retires scripts/sync-lv-conf.py for PlatformIO builds.
  -D LV_CONF_INCLUDE_SIMPLE=1
  -I include

; --- Library dependencies ----------------------------------------------------
; Pinned to EXACT versions from docs/library-manifest.md (#159, #185), captured
; from arduino-cli's own resolution during a working build - not from `lib list`.
;
; Exact pins, no ranges. Unpinned drift is what broke this project: the source
; was untouched from 2026-03-02 to 2026-08-09 and went from building to not
; linking at all (#164).
;
; The ten core-bundled libraries (Wire, SPI, WiFi, Network, WebServer, FS,
; ESPmDNS, SPIFFS, SD, Hash) are NOT listed - they ship with the Arduino core
; and move with the platform pin above. That is why the platform version is
; itself a ten-library pin.
;
; SD.h note: under arduino-cli this resolved ambiguously between the core's SD
; and a stray sketchbook SD 1.3.0. PlatformIO takes the core's, and not listing
; it here keeps that explicit rather than reintroducing the ambiguity.
lib_deps =
  lvgl/lvgl@9.5.0
  bodmer/TFT_eSPI@2.5.43
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit FT6206 Library@1.1.1
  adafruit/Adafruit SH110X@2.1.14
  boschsensortec/bsec2@1.10.2610
  boschsensortec/BME68x Sensor Library@1.3.40408
  adafruit/Adafruit LSM6DS@4.7.4
  adafruit/Adafruit LIS3MDL@1.2.5
  adafruit/Adafruit Unified Sensor@1.1.15
  adafruit/Adafruit MAX1704X@1.0.3
  adafruit/Adafruit SHT4x Library@1.0.5
  adafruit/Adafruit FRAM SPI@2.6.2
  adafruit/RTClib@2.1.4

; =============================================================================
; Adafruit ESP32-S3 Feather 4MB Flash 2MB PSRAM (PID 5477) - the original board
; =============================================================================
[env:feather_s3]
board     = adafruit_feather_esp32s3

; --- PSRAM ------------------------------------------------------------------
; The single most expensive setting in this file. PlatformIO's board JSON does
; not specify memory_type at all, so it must be explicit here.
;
; qio_qspi = QIO flash + QUAD-SPI PSRAM. This board (Adafruit PID 5477) has 2MB
; QUAD PSRAM, not octal - boards.txt gives build.flash_type=qio and
; build.psram_type=qspi. Setting octal (qio_opi) would leave PSRAM absent with
; NO build error: the LVGL draw buffers AND the LVGL heap (#164) both live in
; PSRAM and would fail to allocate at runtime instead.
board_build.arduino.memory_type = qio_qspi

; --- Partition table --------------------------------------------------------
; VENDORED, not referenced by name. PlatformIO's board JSON defaults to
; tinyuf2-partitions-4MB.csv - the WITH-OTA variant, ~1.3MB app. The firmware
; is 1,815,046 bytes and does NOT fit that. arduino-cli uses the -noota variant
; (2816K app), which is where the familiar "Maximum is 2883584" comes from.
;
; The vendored copy is byte-identical to the table the working arduino-cli
; build generates. Keeping it in-repo rather than trusting a filename to
; resolve is the same lesson as Epic A: build inputs live in git.
board_build.partitions = partitions/tinyuf2-partitions-4MB-noota.csv

; --- Flash ------------------------------------------------------------------
; boards.txt: build.flash_size=4MB, build.flash_freq=80m, build.flash_mode=dio.
; PlatformIO's board JSON says flash_mode=qio. dio is chosen here to match the
; arduino-cli build so B6's parity check compares like with like; qio may be a
; deliberate improvement later, but not as an accident of tooling.
board_upload.flash_size = 4MB
board_build.flash_mode  = dio
board_build.f_flash     = 80000000L

; --- Board-specific TFT control lines (docs/HARDWARE.md, Pin Assignments) ---
; A0 -> TFT_CS, A1 -> TFT_DC, A2 -> TFT_RST on the Adafruit header.
build_flags =
  ${env.build_flags}
  -D TFT_CS=18
  -D TFT_DC=17
  -D TFT_RST=16

; =============================================================================
; Unexpected Maker FeatherS3[D] (Adafruit PID 6399) - the bench board since the
; 2026-09-05 rewire (#282, #283). docs/HARDWARE.md "UM FeatherS3 rewire".
; =============================================================================
[env:um_feathers3]
; The platform's um_feathers3 board definition: variant um_feathers3, 16 MB
; flash, memory_type qio_qspi, flash_mode qio, default_16MB.csv, and it defines
; ARDUINO_FEATHERS3 (which src/fc_config.h keys on) plus ARDUINO_USB_MODE=1
; (hardware USB-Serial-JTAG: the app enumerates on the same 303A:1001 as the
; ROM bootloader). There is no separate FeatherS3D definition in the core; the
; [D] has the same "16MB QSPI Flash" and "8MB Extra QSPI PSRAM" as the FeatherS3
; (Adafruit product page, 2026-09-07), so this definition is the right one.
board     = um_feathers3

; --- PSRAM ------------------------------------------------------------------
; Same trap as the Adafruit env: quad PSRAM, so qio_qspi. Octal (qio_opi) would
; also claim GPIO 33-37 for the PSRAM bus, and 35/36/37 ARE the SPI bus this
; project runs the TFT, SD and FRAM on. Stated explicitly even though the board
; JSON already says qio_qspi, so a board-JSON change cannot flip it silently.
board_build.arduino.memory_type = qio_qspi

; --- Partition table --------------------------------------------------------
; VENDORED copy of the core's default_16MB.csv (byte-identical; verified with
; cmp when it was copied). The 4 MB TinyUF2 table cannot describe this flash.
; This table has no uf2 partition: a PlatformIO flash of this env replaces the
; TinyUF2 bootloader and CircuitPython the board ships with. Restorable from
; UM's releases. The owner decides that at flash time, not this file.
board_build.partitions = partitions/default_16MB.csv

; --- Flash ------------------------------------------------------------------
; Board-JSON values, restated so they are visible next to the Adafruit env's.
; No arduino-cli baseline exists for this board, so there is nothing to match;
; qio is the board definition's own mode.
board_upload.flash_size = 16MB
board_build.flash_mode  = qio
board_build.f_flash     = 80000000L

; --- Board-specific TFT control lines (docs/HARDWARE.md, UM rewire tables) ---
; Adafruit A0 -> UM hole 17 -> TFT_CS, A1 -> 18 -> TFT_DC, A2 -> 14 -> TFT_RST
; (the owner's 2026-09-07 ruling: A2 is TFT_RST until proven otherwise).
build_flags =
  ${env.build_flags}
  -D TFT_CS=17
  -D TFT_DC=18
  -D TFT_RST=14

; =============================================================================
; BUILD ENVIRONMENT - two traps that cost a build each (#183)
; =============================================================================
; 1. RUN pio FROM POWERSHELL OR CMD, NOT GIT BASH.
;    This platform runs idf_tools.py at install time and it hard-refuses MSys/
;    MinGW: "ERROR: MSys/Mingw is not supported". Under Git Bash the tool
;    packages fail to install, then the build dies with either
;    "'xtensa-esp32s3-elf-g++' is not recognized" or a pathlib TypeError on
;    FRAMEWORK_DIR being None. Neither names the real cause.
;
; 2. IF FRAMEWORK_DIR IS None, THE PACKAGE CACHE HAS A VERSION CONFLICT.
;    A globally cached framework-arduinoespressif32 from a DIFFERENT spec URI
;    (seen here: 3.3.9, wanted 3.3.8) leaves the requirement unsatisfied, and
;    PlatformIO reports it as a pathlib TypeError rather than a resolution
;    error. Fix with a project-scoped resolve:
;        pio pkg install
;    run from the project directory, which fetches the exact pinned packages.
;
; =============================================================================
; KNOWN GAP - carried into B6 (#188), not solved here
; =============================================================================
; arduino-cli does two things for this board that PlatformIO does not:
;
;   1. custom_bootloader = bootloader-tinyuf2  (not the stock bootloader)
;   2. writes variants/adafruit_feather_esp32s3/tinyuf2.bin at 0x2d0000
;
; The vendored partition table reserves the 256K "uf2" factory partition, so a
; PlatformIO flash will not clobber an already-installed TinyUF2. But PIO will
; install the STOCK bootloader, which may break UF2 drag-and-drop and the
; double-tap-reset behaviour.
;
; That must be verified on hardware before arduino-cli is retired (#161), and
; the bootloader question resolved in B6. Do not assume it is harmless.
