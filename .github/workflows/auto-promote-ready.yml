name: Auto-Promote Ready Issues

# Fires when a dependency closes. Checks if downstream issues
# have all deps resolved — if so, promotes Todo → Ready via label.
#
# ZERO GraphQL cost from this Action. Uses REST only.
# The sync-labels-to-board Action handles the board field update.
#
# Cron fallback catches edge cases (manual closes, missed events).
on:
  issues:
    types: [closed]
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {} # Manual trigger for testing

# Least privilege, but explicit. Without this the job inherits the repository's
# default GITHUB_TOKEN scope; if that is read-only, every promotion fails with
# "Resource not accessible by integration" — which is exactly what happened for
# 39 consecutive runs before #173.
# Retained even though the job now passes PROJECT_PAT: this block governs the
# default GITHUB_TOKEN, so it keeps the job working if the PAT is ever removed
# or expires — which PROJECT_PAT already did once, silently, for three weeks.
permissions:
  issues: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote unblocked issues to Ready
        uses: actions/github-script@v7
        with:
          # PROJECT_PAT, not the default GITHUB_TOKEN.
          #
          # GitHub deliberately does NOT trigger workflows from events caused by
          # the default GITHUB_TOKEN. So when this job added `board:ready`, the
          # `labeled` event was suppressed and sync-labels-to-board never ran —
          # leaving every auto-promoted issue carrying BOTH `board:todo` and
          # `board:ready`, with its project Status field never updated.
          #
          # Observed on #184: promoted at 19:28:07, no sync run followed, board
          # still read "Todo" while the issue was Ready. #147 and #154 had the
          # same history; the manual backfill in #175 masked it because a label
          # added by a human DOES trigger the sync.
          #
          # REST-only is still true, so the comment above was not wrong about
          # scope — it was wrong about consequences. (#177)
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            const OWNER = 'Strycher';
            const REPO = 'Field_Compass';

            // ── Step 1: Get all issues (open + closed for dep resolution) ──
            // Uses REST pagination — zero GraphQL cost.
            let allIssues = [];
            let page = 1;
            while (true) {
              const batch = await github.rest.issues.listForRepo({
                owner: OWNER,
                repo: REPO,
                state: 'all',
                per_page: 100,
                page: page,
              });
              // Filter out pull requests (GitHub REST returns PRs in issues endpoint)
              const issuesOnly = batch.data.filter(i => !i.pull_request);
              allIssues = allIssues.concat(issuesOnly);
              if (batch.data.length < 100) break;
              page++;
            }

            // Build lookup: issue number → { state, labels }
            const issueMap = {};
            for (const issue of allIssues) {
              issueMap[issue.number] = {
                state: issue.state,
                labels: issue.labels.map(l => l.name),
              };
            }

            core.info(`Loaded ${allIssues.length} issues`);

            // ── Step 2: Find open Todo issues with all deps resolved ──
            const dependsOnRegex = /<!--\s*depends-on:\s*(#\d+(?:\s*,\s*#\d+)*)\s*-->/g;
            const promotionCandidates = [];

            for (const issue of allIssues) {
              if (issue.state !== 'open') continue;
              if (!issue.body) continue;

              // Must currently be in Todo (has board:todo label)
              const labels = issue.labels.map(l => l.name);
              if (!labels.includes('board:todo')) continue;

              // Parse depends-on tags
              const matches = [...issue.body.matchAll(dependsOnRegex)];
              if (matches.length === 0) continue;

              const deps = [];
              for (const match of matches) {
                const numMatches = match[1].matchAll(/#(\d+)/g);
                for (const nm of numMatches) {
                  deps.push(parseInt(nm[1]));
                }
              }

              if (deps.length === 0) continue;

              // Check if ALL dependencies are closed
              const allDepsClosed = deps.every(
                depNum => issueMap[depNum]?.state === 'closed'
              );

              if (allDepsClosed) {
                promotionCandidates.push({
                  number: issue.number,
                  title: issue.title,
                  deps: deps,
                });
              }
            }

            core.info(`Found ${promotionCandidates.length} issues to promote`);

            if (promotionCandidates.length === 0) {
              core.info('No issues to promote. Done.');
              return;
            }

            // ── Step 3: Promote by adding board:ready label (REST) ──
            // The sync-labels-to-board Action handles the board field update.
            // Label mutual exclusion (removing board:todo) is also handled there.
            let promoted = 0;
            const failures = [];

            for (const candidate of promotionCandidates) {
              try {
                // Add board:ready label — triggers sync-labels-to-board Action
                await github.rest.issues.addLabels({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: candidate.number,
                  labels: ['board:ready'],
                });

                // Audit trail comment
                await github.rest.issues.createComment({
                  owner: OWNER,
                  repo: REPO,
                  issue_number: candidate.number,
                  body: `🤖 **Auto-promoted to Ready** — all dependencies resolved (${candidate.deps.map(d => '#' + d).join(', ')} closed).`,
                });

                core.info(
                  `✅ Promoted #${candidate.number} (${candidate.title}) to Ready`
                );
                promoted++;
              } catch (e) {
                // NOT a warning. This workflow exists to make a state change;
                // if the change did not happen, the run has failed. A green
                // check on a no-op automation is worse than an outage, because
                // the only visible signal says everything is fine. (#173)
                failures.push(`#${candidate.number}: ${e.message}`);
                core.error(
                  `Failed to promote #${candidate.number}: ${e.message}`
                );
              }
            }

            core.info(`\nDone! Promoted ${promoted} issues to Ready.`);

            if (failures.length > 0) {
              core.setFailed(
                `${failures.length} of ${promotionCandidates.length} promotions failed:\n  ` +
                failures.join('\n  ') +
                `\n\nIf this reads "Resource not accessible by integration", the job ` +
                `lacks issues:write — check the permissions block and the repository's ` +
                `default workflow permissions.`
              );
            }
