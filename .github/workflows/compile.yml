name: Compile

# The compile gate. Until this existed, a PR could merge with firmware that does
# not build: PRs #202, #204 and #207 each merged with 0 checks reported, while
# CLAUDE.md asserted a CI gate that had never been written (#150).
#
# C1 of Epic #155, Feature #217. Scoped to authoring the gate. Proving it blocks,
# and deciding required-vs-advisory, is C3 (#223). Caching is C2 (#222).
#
# Uses `pio run`, not `arduino-cli` — #150 was written against
# `arduino-cli compile Field_Compass/`, a directory #186 deleted.
#
# A clean build from an empty PLATFORMIO_CORE_DIR was verified before this was
# written: 183.86 s, 0 errors, 21 libraries resolved from lib_deps. #150's stated
# blocker (lv_conf.h and TFT_eSPI's User_Setup.h outside the repo) was already
# closed by Epic B — #158, #184, #185. See docs/ci-diagnosis.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# NO `paths:` FILTER, DELIBERATELY.
#
# A paths filter looks right and is a trap once C3 (#223) promotes this to a
# required check: a docs-only PR would never trigger the workflow, the required
# check would sit "expected" forever, and documentation would become unmergeable
# — forcing people to fake a firmware change to get a green tick.
#
# Instead the workflow ALWAYS runs and reports, and the expensive steps decide
# internally whether there is firmware to build. A docs-only PR costs a runner
# start and a checkout, and still reports the green check branch protection needs.

permissions:
  contents: read

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Envs are DISCOVERED from platformio.ini, never listed.
  #
  # One env exists today (feather_s3), with a UM FeatherS3 profile coming. A
  # hardcoded list covers the new env only if somebody remembers to add it —
  # exactly how meshcore's NimBLE defect recurred four times, in envs neither
  # built in CI nor able to fail a release. Discovery cannot be forgotten.
  discover:
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.find.outputs.envs }}
      firmware_changed: ${{ steps.changed.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # need history to diff a PR against its base

      # configparser, not grep. A regex on `^\[env:` silently misses an indented
      # section and cannot tell a commented-out one from a real one — so an env
      # would vanish from CI the first time someone reformatted the file, with
      # no error. configparser is the same parser PlatformIO itself uses.
      - name: Discover build environments
        id: find
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/envs.json
          import configparser, json
          cp = configparser.ConfigParser(strict=False, inline_comment_prefixes=(';',))
          cp.read('platformio.ini', encoding='utf-8')
          envs = sorted(s[4:] for s in cp.sections() if s.startswith('env:') and s != 'env:')
          print(json.dumps(envs, separators=(',', ':')))
          PY
          envs=$(cat /tmp/envs.json)
          count=$(python -c "import json,sys; print(len(json.load(sys.stdin)))" < /tmp/envs.json)
          echo "Discovered $count environment(s): $envs"
          echo "envs=$envs"   >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      # A matrix over an empty list is SKIPPED, and `needs:` treats a skipped job
      # as success — so zero envs would make this workflow a green light that
      # compiled nothing. That is the exact failure the gate exists to prevent,
      # reintroduced one level up.
      #
      # Reads the STEP OUTPUT, not the file. $GITHUB_OUTPUT is a distinct file
      # per step, so grepping it from a later step always sees an empty file.
      # That bug failed this workflow on its very first run: discovery correctly
      # found feather_s3, the guard read an empty file, and the gate went red
      # claiming zero envs. Only a live run could surface it — locally the
      # discovery logic and the guard logic were each verified in isolation, and
      # the wiring between them exists only on GitHub.
      - name: Fail if no environments were discovered
        run: |
          count="${{ steps.find.outputs.count }}"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error::No [env:*] sections found in platformio.ini"
            exit 1
          fi
          echo "$count environment(s) discovered"

      # FAIL-SAFE DEFAULT: firmware=true unless a diff is successfully computed
      # AND proves no firmware path was touched. Once `build` is skipped rather
      # than merely idle (see the job's `if:`), a detector that silently returns
      # nothing would skip the compile and still report a green gate. Defaulting
      # to true means a broken detector costs four minutes, not a false pass.
      # Pattern follows CoreScope-OKI's `changes` job.
      - name: Detect firmware changes
        id: changed
        run: |
          set -uo pipefail
          firmware=true

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
              files=$(git diff --name-only "$base" "$head" 2>/dev/null || true)
              echo "Changed files:"; printf '%s\n' "$files" | sed 's/^/  /'
              if [ -n "$files" ] && ! printf '%s\n' "$files" \
                   | grep -qE '^(src/|include/|lib/|partitions/|platformio\.ini|\.github/workflows/compile\.yml|\.github/actions/setup-build-environment/)'; then
                firmware=false
              fi
            else
              echo "Base sha unavailable — defaulting to a full build."
            fi
          else
            echo "Push to main or manual dispatch — always build."
          fi

          echo "firmware = $firmware"
          [ "$firmware" = "true" ] || echo "No firmware paths touched — the build job will be skipped entirely."
          echo "firmware=$firmware" >> "$GITHUB_OUTPUT"

  # Skipped ENTIRELY on a docs-only PR — the job never starts, rather than
  # starting a runner to evaluate a handful of `if:` conditions and echo a
  # notice. Owner ruling, aligned with CoreScope-OKI, whose downstream jobs
  # carry `if: needs.changes.outputs.code == 'true'`.
  #
  # This is why `discover`'s detector defaults to firmware=true: a skipped
  # build reports `skipped`, and `compile-gate` only tolerates that when
  # firmware_changed is genuinely false. A detector that failed open the other
  # way would skip the compile and still pass the gate.
  build:
    needs: discover
    if: needs.discover.outputs.firmware_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one broken env must not hide the state of others
      matrix:
        env: ${{ fromJson(needs.discover.outputs.envs) }}
    name: build (${{ matrix.env }})
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      # `pio run --target size` rather than binutils `size`: the host `size` on
      # the runner is x86 binutils and is not guaranteed to read an Xtensa ELF,
      # whereas pio dispatches the toolchain's own. It recompiles nothing.
      - name: Report size
        run: pio run -e ${{ matrix.env }} --target size

  # THIS is the job to require in branch protection — never `build (feather_s3)`.
  #
  # `build`'s job name is GENERATED from the matrix, which is generated from the
  # discovered envs. Requiring the generated name by hand undoes the discovery
  # design in both directions:
  #
  #   - add the UM FeatherS3 profile and you get `build (um_feathers3)`, which is
  #     NOT in the required list — the new env ships unguarded, which is exactly
  #     the meshcore NimBLE failure discovery exists to prevent
  #   - rename or drop `feather_s3` and the required check never reports again;
  #     every PR blocks forever on a check stuck at "expected"
  #
  # `compile-gate` has a fixed name whatever the env list does, so protection is
  # written once and never revisited.
  #
  # It also closes the skipped-matrix hole at the protection level. Two distinct
  # meanings of "skipped" are easy to conflate, so precisely: `needs:` treats a
  # skipped dependency as satisfied for DEPENDENCY RESOLUTION — a downstream job
  # still starts — but `needs.<job>.result` is the string `skipped`, which is not
  # `success`. So requiring `success` here does close the hole, while the older
  # phrasing ("needs: treats a skipped job as success") was imprecise.
  #
  # `if: always()` is required: without it this job is itself skipped when a
  # dependency fails, and a skipped required check never reports.
  #
  # Verified before this job existed (#223): a deliberate syntax error made
  # `build (feather_s3)` fail, and the PR still reported mergeable=MERGEABLE,
  # mergeStateStatus=UNSTABLE — red, and merge allowed anyway.
  compile-gate:
    needs: [discover, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # FAILS CLOSED, cancellation included, and that is deliberate.
      #
      # The adversarial review argued a cancelled run should exit 0 so a manual
      # cancel does not leave a red required check. Rejected: that turns Cancel
      # into a one-click bypass — cancel the build, the gate reports success,
      # and unverified firmware becomes mergeable. For a gate, "nothing was
      # verified" must never read as "verified fine".
      #
      # Accepted cost: cancelling a run leaves this check red on that commit
      # until it is re-run or a new commit is pushed. `concurrency` already
      # cancels superseded runs, but those sit on commits that are no longer
      # head, so the common case is unaffected.
      #
      # Cancelled is reported distinctly from failed so the log says which
      # happened rather than leaving someone hunting a compile error that does
      # not exist.
      - name: Aggregate job results
        run: |
          d='${{ needs.discover.result }}'
          b='${{ needs.build.result }}'
          fw='${{ needs.discover.outputs.firmware_changed }}'
          echo "discover          = $d"
          echo "build             = $b"
          echo "firmware_changed  = $fw"

          if [ "$d" = "cancelled" ] || [ "$b" = "cancelled" ]; then
            echo "::error::Run was cancelled, so nothing was verified. The gate fails closed - re-run it or push again. This is NOT a compile error."
            exit 1
          fi

          # discover must always succeed. Everything below trusts its outputs,
          # so a failed discover can never be waved through as a docs-only PR.
          if [ "$d" != "success" ]; then
            echo "::error::discover did not succeed ($d)"
            exit 1
          fi

          if [ "$fw" = "true" ]; then
            # Firmware changed: the build must have run and passed. `skipped`
            # here would mean the compile silently did not happen.
            if [ "$b" != "success" ]; then
              echo "::error::firmware changed but build did not succeed ($b)"
              exit 1
            fi
          else
            # Docs-only: the build job is skipped by design, and that is the
            # ONLY circumstance in which a non-success build result passes.
            case "$b" in
              skipped|success) echo "No firmware changes; build legitimately skipped." ;;
              *) echo "::error::build reported '$b' on a docs-only change, which should not happen"; exit 1 ;;
            esac
          fi

          echo "Compile gate passed."
