# =============================================================================
# Version Bump — increment version tag on every merge to main
# =============================================================================
# Reads the commit prefix (feat/fix/chore/etc.) and bumps semver accordingly.
# Tag-only (no version file to update).
#
# Safety:
#   - Concurrency group queues concurrent runs (no cancel)
#   - ref:main + fetch-tags + pull --rebase ensures latest state
#   - Tag-exists check prevents duplicate tag errors
#   - actor guard prevents infinite loop from its own push
# =============================================================================

name: Version Bump

on:
  push:
    branches: [main]
    # FIRMWARE CHANGES ONLY (#191).
    #
    # This used to tag every merge. On 2026-08-09 that produced 14 tags against
    # ONE firmware commit — docs, workflow fixes, hook wiring and a flash-guard
    # script all got version tags, and v0.52.0 was a MINOR bump because a commit
    # began with "feat:". Meanwhile FW_VERSION in the source read 0.51.1 and the
    # firmware had not changed since 2026-03-02. The tags claimed releases that
    # did not exist.
    #
    # These four paths are the ones that change the binary:
    paths:
      - 'src/**'              # the source — moved from Field_Compass/ by B4 (#186)
      - 'include/**'          # lv_conf.h — LVGL memory model (#158, #164)
      - 'lib/**'              # vendored libraries — compiled in, so they count (#186)
      - 'platformio.ini'      # partition table, PSRAM mode, build flags (#183)
      - 'partitions/**'       # flash layout
    # Deliberately excluded: docs/**, .github/**, .claude/**, scripts/**.
    # None of them alter the firmware image, so none of them earn a version.

concurrency:
  group: auto-version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'Strycher/Field_Compass'
      && github.actor != 'github-actions[bot]'
      && !startsWith(github.event.head_commit.message, 'chore: bump version')
      && !startsWith(github.event.head_commit.message, 'bd:')
      && !startsWith(github.event.head_commit.message, 'Merge')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Pull latest main (in case queued behind another bump)
        run: git pull origin main --rebase

      - name: Get latest tag
        id: current
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Current tag: $TAG"

      - name: Determine bump type
        id: bump
        run: |
          MSG=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          echo "Commit message: $MSG"
          PREFIX=$(echo "$MSG" | grep -oP '^\w+' | head -1)

          # MAJOR: conventional-commits breaking marker. Nothing bumped MAJOR
          # before this — feat gave minor, everything else patch — so a breaking
          # firmware change was indistinguishable from a typo fix. (#191)
          if echo "$MSG" | grep -qE '^\w+(\([^)]*\))?!:' || echo "$BODY" | grep -q 'BREAKING CHANGE'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
            echo "Bump type: MAJOR (breaking change)"
          elif [ "$PREFIX" = "feat" ]; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
            echo "Bump type: MINOR (new feature)"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
            echo "Bump type: PATCH ($PREFIX)"
          fi

      - name: Calculate new version
        id: new
        run: |
          TAG="${{ steps.current.outputs.tag }}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac

          NEW="v${MAJOR}.${MINOR}.${PATCH}"
          echo "tag=$NEW" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW"

      - name: Tag and push
        run: |
          NEW="${{ steps.new.outputs.tag }}"

          if git rev-parse "$NEW" >/dev/null 2>&1; then
            # FAIL, do not exit 0. (#191)
            #
            # Runs are serialised by the concurrency group above, so a queued
            # run cannot legitimately collide — it pulls latest main and
            # recomputes first. A collision therefore means the version
            # calculation is wrong, and exiting 0 hid that behind a green check.
            #
            # This is the exact silent-skip shape of the 2026-03-29 incident in
            # SAFELANE section 7: a bumper that ran 270 times, found the tag
            # already present, and skipped silently every time while the version
            # went stale.
            echo "::error::Tag $NEW already exists. Runs are serialised, so this"
            echo "::error::means the version calculation is wrong, not that a"
            echo "::error::queued run raced. Current tag was ${{ steps.current.outputs.tag }}."
            exit 1
          fi

          git tag -a "$NEW" -m "$NEW"
          git push origin "$NEW"
          echo "✅ Version bumped: ${{ steps.current.outputs.tag }} → $NEW"
