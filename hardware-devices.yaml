# hardware-devices.yaml - Field Compass
# =============================================================================
# Registry of physical USB devices, consumed by scripts/pio-flash.py.
#
# TRACKED IN GIT ON PURPOSE. The upstream copies in meshcore-firmware and
# wadamesh are untracked, which is why pio-flash refuses in most of their
# worktrees (DifferentWire/standards#259). A safety system whose source of
# truth exists on exactly one disk is not a safety system.
#
# devices:         hardware this project owns and may flash.
# foreign_devices: hardware belonging to other projects. Present so this
#                  wrapper RECOGNISES and REFUSES them rather than treating
#                  them as unknown. Imported 2026-08-09 as the union of the
#                  LoRa, meshcore-firmware and wadamesh registries; those three
#                  had already diverged (LoRa knew 8 devices, meshcore 19).
#
# Tracks: Strycher/Field_Compass#172
# =============================================================================

