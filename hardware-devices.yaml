    mac: b8:f8:62:d5:44:40
    usb_serial: B8:F8:62:D5:44:40
    role: Field Compass - Adafruit ESP32-S3 Feather 4MB/2MB PSRAM (PID 5477), 3.5in ST7796 TFT + FT6336U
      touch, GPS/IMU/SD/FRAM
    vid_pid:
    - 239A:811B
    - 303A:1001
    discriminators:
      windows:
        runtime_deviceid_instance: 8&52BB9D8&0&0000
        bootloader_usb_serial: B8:F8:62:D5:44:40
    notes: 'Captured from hardware 2026-08-09 (#172). App mode enumerates as Adafruit TinyUSB CDC 239A:811B
      with NO usb serial - the ''8&...'' instance is a Windows hub path, not identity. ROM bootloader
      enumerates as Espressif USB-JTAG 303A:1001 carrying the MAC as its usb serial. Cross-vendor plus
      a serial-less running port, so bootloader discovery matches on the registry serial above - see _discover_bootloader_port
      (#172). BOOT button is buried in the enclosure: never require a physical press; bootloader entry
      is esptool --before default-reset --after no-reset chip-id. Bulk read-flash does not work over native
      USB-Serial/JTAG.'
